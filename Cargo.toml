[workspace]
resolver = "3"
members = [
    "crates/codescope-core",
    "crates/codescope-git",
    "crates/codescope-lsp",
    "crates/codescope-analysis",
    "crates/codescope-ai",
    "crates/codescope-telemetry",
    "crates/codescope-tui",
    "crates/codescope",
    "crates/codescope-testutil",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
authors = ["Damian Barabonkov <dbctl@pm.me>"]
license = "Apache-2.0"
repository = "https://github.com/DamianB-BitFlipper/codescope"
homepage = "https://github.com/DamianB-BitFlipper/codescope"
readme = "README.md"

[workspace.dependencies]
# Workspace crates keep their local paths for development and explicit versions for packaged
# manifests, where Cargo removes `path` before publishing to crates.io.
codescope-ai = { version = "=0.1.0-alpha.1", path = "crates/codescope-ai" }
codescope-analysis = { version = "=0.1.0-alpha.1", path = "crates/codescope-analysis" }
codescope-core = { version = "=0.1.0-alpha.1", path = "crates/codescope-core" }
codescope-git = { version = "=0.1.0-alpha.1", path = "crates/codescope-git" }
codescope-lsp = { version = "=0.1.0-alpha.1", path = "crates/codescope-lsp" }
codescope-telemetry = { version = "=0.1.0-alpha.1", path = "crates/codescope-telemetry" }
codescope-testutil = { version = "=0.1.0-alpha.1", path = "crates/codescope-testutil" }
codescope-tui = { version = "=0.1.0-alpha.1", path = "crates/codescope-tui" }

# verified versions (docs/research)
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util", "io-std", "net"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tokio-stream = "0.1"
futures = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1"
lsp-types = "0.97"
anyhow = "1.0.104"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
tui-tree-widget = "0.24.1"
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
eventsource-stream = "0.2.3"
secrecy = "0.10.3"
ignore = "0.4.33"
similar = "3.2.0"
unicode-width = "0.2.2"
clap = { version = "4.6.6", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["env", "toml"] }
toml_edit = { version = "0.25.11", features = ["serde"] }
governor = "0.10.4"
backon = "1.6.0"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
url = "2.5"
camino = "1.2"

# dev
tempfile = "3.27"
assert_cmd = "2.2.2"
insta = "1.48.0"
rstest = "0.26.1"
portable-pty = "0.9"

regex = "1.11"
sha2 = "0.10.9"

[profile.dev]
opt-level = 1
